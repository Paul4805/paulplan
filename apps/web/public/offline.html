<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PaulPlan · Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --canvas: #fafafa;
        --ink: #18181b;
        --muted: #71717a;
        --accent: #4f46e5;
        --border: #e8e8ed;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0b0b0f;
          --ink: #f4f4f5;
          --muted: #a1a1aa;
          --accent: #818cf8;
          --border: #26262e;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--canvas);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
      }
      main { max-width: 380px; }
      .mark {
        width: 32px; height: 32px; border-radius: 8px;
        background: var(--accent); color: #fff;
        display: grid; place-items: center;
        font-size: 11px; font-weight: 600; margin-bottom: 24px;
      }
      h1 { font-size: 20px; letter-spacing: -0.01em; margin: 0 0 8px; }
      p { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
      button {
        font: inherit; font-size: 14px; font-weight: 500;
        background: var(--accent); color: #fff;
        border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer;
      }
      hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }
      small { color: var(--muted); font-size: 12px; line-height: 1.6; display: block; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">P</div>
      <h1>You are offline</h1>
      <p>
        The app shell is cached, but this page was not. Reconnect and open PaulPlan again — your data
        is already stored locally and will sync when the connection returns.
      </p>
      <button onclick="location.reload()">Try again</button>
      <hr />
      <small>Reminders fire on your phone. The web dashboard shows them while it is open.</small>
    </main>
  </body>
</html>
